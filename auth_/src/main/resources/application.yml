server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: trekly-auth
  datasource:
    url: jdbc:postgresql://localhost:5433/trekly_auth
    username: postgres
    password: secret123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    '[com.trekly]': INFO
    '[org.springframework]': WARN

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000