<div class="login-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ 'auth.loginTitle' | translate }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>{{ 'auth.email' | translate }}</mat-label>
                    <input matInput formControlName="email" [placeholder]="'auth.emailPlaceholder' | translate">
                    <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
                        {{ 'auth.emailInvalid' | translate }}
                    </mat-error>
                    <mat-error *ngIf="loginForm.get('email')?.hasError('required')"
                        [innerHTML]="'auth.emailRequired' | translate">
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>{{ 'auth.password' | translate }}</mat-label>
                    <input matInput formControlName="password" type="password">
                    <mat-error *ngIf="loginForm.get('password')?.hasError('required')"
                        [innerHTML]="'auth.passwordRequired' | translate">
                    </mat-error>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid"
                    class="full-width">
                    {{ 'auth.login' | translate }}
                </button>

                <button mat-stroked-button color="primary" type="button" (click)="loginWithGoogle()" class="full-width"
                    style="margin-top:8px;">
                    <mat-icon>login</mat-icon>
                    Sign in with Google
                </button>
            </form>
        </mat-card-content>
        <mat-card-actions align="end">
            <a routerLink="/auth/register" mat-button color="accent">{{ 'auth.createAccount' | translate }}</a>
        </mat-card-actions>
    </mat-card>
</div>
