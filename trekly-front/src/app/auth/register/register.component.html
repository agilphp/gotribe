<div class="register-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Join TREKLY</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" placeholder="Ex. pat@example.com">
                    <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                        Please enter a valid email address
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
                        Email is <strong>required</strong>
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput formControlName="password" type="password">
                    <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
                        Password is <strong>required</strong>
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
                        Password must be at least 8 characters
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Role</mat-label>
                    <input matInput formControlName="role" placeholder="MEMBER or CREATOR">
                    <!-- Ideally a select, but keeping simple for now as per MVP -->
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="!registerForm.valid"
                    class="full-width">
                    Register
                </button>
            </form>
        </mat-card-content>
        <mat-card-actions align="end">
            <a routerLink="/auth/login" mat-button color="accent">Already have an account?</a>
        </mat-card-actions>
    </mat-card>
</div>
