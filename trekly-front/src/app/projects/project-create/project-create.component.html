<div class="container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Create New Adventure</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Title</mat-label>
                    <input matInput formControlName="title">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Description</mat-label>
                    <textarea matInput formControlName="description" rows="3"></textarea>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Activity Type</mat-label>
                    <mat-select formControlName="activityType">
                        <mat-option value="HIKING">Hiking</mat-option>
                        <mat-option value="RUNNING">Running</mat-option>
                        <mat-option value="MTB">MTB</mat-option>
                        <mat-option value="TRIATHLON">Triathlon</mat-option>
                        <mat-option value="MIXED">Mixed</mat-option>
                    </mat-select>
                </mat-form-field>

                <div class="image-upload-section">
                    <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*"
                        style="display: none;">
                    <button type="button" mat-stroked-button color="primary" (click)="fileInput.click()"
                        style="margin-bottom: 15px;">
                        <mat-icon>upload</mat-icon> Upload Image
                    </button>
                    <div *ngIf="imagePreview" class="image-preview">
                        <img [src]="imagePreview" alt="Preview">
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <mat-form-field appearance="outline" style="flex: 1;">
                        <mat-label>Start Date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="startDate">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>

                    <mat-form-field appearance="outline" style="flex: 1;">
                        <mat-label>Start Time</mat-label>
                        <input matInput type="time" formControlName="startTime">
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Meeting Point</mat-label>
                    <input matInput formControlName="meetingPoint">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Price</mat-label>
                    <input matInput type="number" formControlName="price">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Currency</mat-label>
                    <input matInput formControlName="currency">
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="!projectForm.valid">Create</button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
