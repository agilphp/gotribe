<div class="container">
    <div class="header">
        <h1>Explore Adventures</h1>
        <div *ngIf="currentUser$ | async as user; else loginBtn">
            <button *ngIf="user.role !== 'MEMBER'" mat-raised-button color="primary" routerLink="/projects/create"
                style="margin-right: 10px;">Create Adventure</button>
            <button mat-stroked-button color="warn" (click)="logout()">Logout</button>
        </div>
        <ng-template #loginBtn>
            <button mat-raised-button color="accent" routerLink="/auth/login">Login to Create</button>
        </ng-template>
    </div>

    <div class="projects-grid">
        <mat-card *ngFor="let project of projects" class="project-card">
            <img mat-card-image [src]="project.imageUrl || getImageForActivity(project.activityType)"
                alt="Activity Image">
            <mat-card-header>
                <mat-card-title>{{ project.title }}</mat-card-title>
                <mat-card-subtitle>
                    {{ project.activityType }} • {{ project.startDateTime | date:'medium' }}
                    <div class="creator-rating" *ngIf="project.creatorRating > 0"
                        style="display: flex; align-items: center; margin-top: 5px;">
                        <app-star-rating [rating]="project.creatorRating" [readonly]="true"></app-star-rating>
                        <span class="rating-count" style="margin-left: 5px; font-size: 0.9em; color: #666;">({{
                            project.creatorTotalRatings }})</span>
                    </div>
                </mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
                <p>Price: {{ project.price | currency:project.currency }}</p>
                <div *ngIf="project.isActive === false" style="color: red; font-weight: bold;">EXPIRED</div>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button color="primary" (click)="openDetailsDialog(project)">DETAILS</button>
                <ng-container *ngIf="currentUser$ | async as user">
                    <button
                        *ngIf="user.role === 'MEMBER' && !joinedProjectIds.has(project.id) && user.userId !== project.creatorId"
                        mat-button color="accent" (click)="joinProject(project.id)">JOIN</button>
                    <span *ngIf="user.role === 'MEMBER' && joinedProjectIds.has(project.id)"
                        style="color: blue; margin-left: 10px; font-weight: bold;">JOINED ✓</span>
                </ng-container>
                <ng-container *ngIf="currentUser$ | async as user">
                    <button *ngIf="user.role === 'MEMBER' && !ratedProjectIds.has(project.id)" mat-stroked-button
                        color="warn" (click)="openRateDialog(project.id, project.creatorId)">RATE</button>
                    <span *ngIf="user.role === 'MEMBER' && ratedProjectIds.has(project.id)"
                        style="color: green; margin-left: 10px; font-weight: bold;">RATED ✓</span>
                </ng-container>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
