<div class="container">
    <div class="header">
        <h1>Explore Adventures</h1>
        <div *ngIf="isLoggedIn$ | async; else loginBtn">
            <button mat-raised-button color="primary" routerLink="/projects/create" style="margin-right: 10px;">Create
                Adventure</button>
            <button mat-stroked-button color="warn" (click)="logout()">Logout</button>
        </div>
        <ng-template #loginBtn>
            <button mat-raised-button color="accent" routerLink="/auth/login">Login to Create</button>
        </ng-template>
    </div>

    <div class="projects-grid">
        <mat-card *ngFor="let project of projects" class="project-card">
            <img mat-card-image [src]="project.imageUrl || getImageForActivity(project.activityType)"
                alt="Activity Image">
            <mat-card-header>
                <mat-card-title>{{ project.title }}</mat-card-title>
                <mat-card-subtitle>{{ project.activityType }} • {{ project.startDateTime | date:'medium'
                    }}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
                <p>Price: {{ project.price | currency:project.currency }}</p>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button color="primary">DETAILS</button>
                <button mat-button color="accent">JOIN</button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
